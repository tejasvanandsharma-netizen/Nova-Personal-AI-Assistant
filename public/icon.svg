<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#2563eb" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Orbital Cyber Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="30 18" opacity="0.8"/>

  <!-- Central Sci-Fi Diamond Neural Core -->
  <g filter="url(#neonGlow)">
    <!-- Outer Shield / Diamond -->
    <polygon points="256,90 390,224 256,422 122,224" fill="none" stroke="url(#neonBlue)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Inner Core -->
    <polygon points="256,150 336,230 256,350 176,230" fill="url(#neonBlue)" fill-opacity="0.25" stroke="url(#cyanAccent)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Central Power Node -->
    <circle cx="256" cy="240" r="32" fill="#ffffff"/>
    <circle cx="256" cy="240" r="42" fill="none" stroke="#38bdf8" stroke-width="6"/>
  </g>

  <!-- Cybernetic Grid Points -->
  <circle cx="122" cy="224" r="7" fill="#60a5fa"/>
  <circle cx="390" cy="224" r="7" fill="#60a5fa"/>
  <circle cx="256" cy="90" r="8" fill="#93c5fd"/>
  <circle cx="256" cy="422" r="8" fill="#93c5fd"/>

  <!-- NOVA Monogram Tech Title -->
  <text x="256" y="470" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-weight="800" font-size="34" letter-spacing="10" fill="#93c5fd">NOVA AI</text>
</svg>
